<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">동화풍 커플 공동 정원 미리보기</title>
  <desc id="desc">두 사람의 연결 완료 메시지와 동화 같은 하늘, 반짝이는 빛, 나무 팻말, 꽃이 핀 공동 정원과 하단 메뉴</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4f1"/><stop offset="1" stop-color="#f3e9e5"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bd5e7"/><stop offset=".38" stop-color="#d7eff0"/><stop offset=".61" stop-color="#f5f2d5"/><stop offset=".62" stop-color="#b1d881"/><stop offset="1" stop-color="#78ac62"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9aa70"/><stop offset=".7" stop-color="#a56e43"/><stop offset="1" stop-color="#8d5b39"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#fff5bd" stop-opacity=".95"/><stop offset="1" stop-color="#fff5bd" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#573c38" flood-opacity=".14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="900" height="1600" fill="url(#page)"/>
  <rect x="42" y="42" width="816" height="1516" rx="54" fill="#fffaf8" stroke="#eadbd8" stroke-width="3" filter="url(#shadow)"/>
  <text x="94" y="126" font-family="Arial,sans-serif" font-size="35" fill="#6f5d63">💐 꽃편지</text>
  <rect x="88" y="166" width="724" height="84" rx="24" fill="#fff0f2"/>
  <text x="450" y="220" text-anchor="middle" font-family="Arial,'Apple SD Gothic Neo',sans-serif" font-size="31" font-weight="700" fill="#9d5260">내 이름 💘 상대 이름 연결 됐어요</text>
  <text x="92" y="322" font-family="Arial,'Apple SD Gothic Neo',sans-serif" font-size="48" font-weight="700" fill="#302a29">우리의 정원</text>
  <text x="94" y="371" font-family="Arial,'Apple SD Gothic Neo',sans-serif" font-size="24" fill="#78676b">함께 건넨 꽃과 마음이 정원에 피어나요.</text>
  <rect x="88" y="415" width="724" height="770" rx="38" fill="url(#sky)" stroke="#fff" stroke-width="5"/>
  <!-- enchanted clouds and moonlit glow -->
  <ellipse cx="190" cy="545" rx="155" ry="94" fill="url(#glow)" opacity=".55"/>
  <text x="140" y="550" font-family="Arial,sans-serif" font-size="54" opacity=".88">☁️</text>
  <text x="660" y="565" font-family="Arial,sans-serif" font-size="48" opacity=".88">☁️</text>
  <text x="720" y="670" font-family="Arial,sans-serif" font-size="33">🦋</text>
  <g fill="#fff5bd" opacity=".95"><path d="M180 635l8 17 17 8-17 8-8 17-8-17-17-8 17-8z"/><path d="M704 765l6 13 13 6-13 6-6 13-6-13-13-6 13-6z"/><circle cx="235" cy="710" r="5"/><circle cx="630" cy="620" r="5"/><circle cx="740" cy="850" r="6"/><circle cx="159" cy="930" r="5"/></g>
  <!-- layered storybook hills -->
  <ellipse cx="90" cy="1175" rx="245" ry="210" fill="#79b76b"/>
  <ellipse cx="825" cy="1180" rx="250" ry="220" fill="#72ad63"/>
  <ellipse cx="465" cy="1250" rx="390" ry="200" fill="#5f9e58" opacity=".6"/>
  <!-- wooden sign -->
  <path d="M432 570h36v158h-36z" fill="#70482c"/>
  <rect x="251" y="458" width="398" height="160" rx="20" fill="#694329" filter="url(#shadow)"/>
  <rect x="263" y="446" width="374" height="146" rx="16" fill="url(#wood)" stroke="#84522f" stroke-width="8"/>
  <path d="M282 463h336" stroke="#f2d4a0" stroke-opacity=".38" stroke-width="3"/>
  <text x="450" y="505" text-anchor="middle" font-family="Georgia,'Apple SD Gothic Neo',serif" font-size="32" font-weight="700" fill="#fff7db" style="paint-order:stroke;stroke:#754b2d;stroke-width:1">우리의 정원</text>
  <rect x="310" y="520" width="280" height="44" rx="12" fill="#fff9e9" stroke="#ead3a5" stroke-width="2"/>
  <text x="450" y="549" text-anchor="middle" font-family="Arial,'Apple SD Gothic Neo',sans-serif" font-size="19" fill="#806f73">여기에 정원 이름을 지어요</text>
  <!-- magical garden count plaque -->
  <rect x="143" y="679" width="614" height="72" rx="20" fill="#fffdf0" fill-opacity=".92" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="726" text-anchor="middle" font-family="Arial,'Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="700" fill="#526447">우리 정원에 꽃 3송이가 피어 있어요 🌷</text>
  <!-- flower patch -->
  <g font-family="Arial,sans-serif" font-size="78" text-anchor="middle" filter="url(#shadow)">
    <text x="280" y="910">🌹</text><text x="450" y="887">🌷</text><text x="620" y="915">🌼</text>
    <text x="360" y="1052">🌻</text><text x="540" y="1060">🌸</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><text x="190" y="1050">🌿</text><text x="705" y="1080">🌿</text><text x="245" y="1135">🌱</text><text x="650" y="1140">🌱</text></g>
  <g fill="#fff5bd" opacity=".9"><circle cx="180" cy="850" r="7"/><circle cx="710" cy="990" r="8"/><circle cx="218" cy="1080" r="6"/><circle cx="680" cy="790" r="6"/></g>
  <text x="450" y="1172" text-anchor="middle" font-family="Arial,sans-serif" font-size="29">🌿　✨　🦋　✨　🌿</text>
  <rect x="88" y="1215" width="724" height="90" rx="24" fill="#ce7e8d" filter="url(#shadow)"/>
  <text x="450" y="1273" text-anchor="middle" font-family="Arial,'Apple SD Gothic Neo',sans-serif" font-size="31" font-weight="700" fill="#fff">꽃 선물하러 가기</text>
  <rect x="88" y="1344" width="724" height="142" fill="#fffaf9"/>
  <path d="M88 1344h724" stroke="#e7dfe0" stroke-width="3"/>
  <g font-family="Arial,'Apple SD Gothic Neo',sans-serif" text-anchor="middle">
    <text x="210" y="1410" font-size="34">🌿</text><text x="210" y="1455" font-size="22" font-weight="700" fill="#b65f70">정원</text>
    <text x="450" y="1410" font-size="34">💐</text><text x="450" y="1455" font-size="22" fill="#89777b">꽃 모아보기</text>
    <text x="690" y="1410" font-size="34">⚙️</text><text x="690" y="1455" font-size="22" fill="#89777b">설정</text>
  </g>
  <text x="450" y="1520" text-anchor="middle" font-family="Arial,'Apple SD Gothic Neo',sans-serif" font-size="18" fill="#a18c90">※ 이름과 꽃은 실제 연결 정보에 따라 표시됩니다.</text>
</svg>
