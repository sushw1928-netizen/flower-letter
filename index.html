<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efed">
  <title>꽃편지</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100vh; background: #f4efed; color: #2e2a29; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-tap-highlight-color: transparent; }
    .phone { width: 100%; max-width: 520px; min-height: 100vh; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
    .screen[hidden] { display: none; }
    .title { margin: 0; font-size: clamp(26px, 7vw, 32px); line-height: 1.15; letter-spacing: -.06em; }
    .subtitle { margin: 5px 0 16px; color: #6f5d63; font-size: 15px; line-height: 1.4; }
    .card { overflow: hidden; border: 1px solid rgba(120,96,101,.16); border-radius: 24px; background: rgba(255,255,255,.32); box-shadow: 0 10px 24px rgba(96,72,78,.06); }
    .visual { display: grid; place-items: center; min-height: 260px; background: linear-gradient(#f2eeeb, #efe8e6); }
    .visual img { display: block; width: 100%; height: clamp(280px, 43vh, 430px); object-fit: contain; }
    .text-box { padding: 20px 18px; }
    h2 { margin: 0 0 9px; font-size: clamp(22px, 6vw, 28px); line-height: 1.25; letter-spacing: -.06em; }
    p { margin: 0; color: #5f5557; font-size: 16px; line-height: 1.55; word-break: keep-all; }
    .cta { width: 100%; min-height: 54px; margin-top: 16px; border: 0; border-radius: 16px; background: linear-gradient(180deg, #d38a96, #cc7887); color: #fff; font: inherit; font-size: 21px; font-weight: 700; cursor: pointer; }
    .back { margin: 0 0 12px; padding: 8px 0; border: 0; background: transparent; color: #7b6269; font: inherit; font-size: 15px; cursor: pointer; }
    .box { margin: 14px 0; padding: 14px; border: 1px solid #e7dfe0; border-radius: 16px; background: rgba(255,255,255,.6); }
    label { display: block; margin: 12px 0 6px; color: #594b4f; font-size: 14px; font-weight: 600; }
    input, textarea { width: 100%; border: 1px solid #e2d5d8; border-radius: 12px; padding: 12px; background: #fff; color: #382d31; font: inherit; font-size: 16px; }
    textarea { min-height: 140px; resize: vertical; }
    .choices { display: grid; gap: 10px; }
    .choice { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border: 1px solid #e7dfe0; border-radius: 16px; background: rgba(255,255,255,.55); color: inherit; text-align: left; font: inherit; cursor: pointer; }
    .choice[aria-pressed="true"] { border: 2px solid #cf7181; background: #fff6f7; }
    .emoji { font-size: 30px; }
    .choice strong, .choice small { display: block; }
    .choice small, .hint { margin-top: 3px; color: #806f73; font-size: 13px; }
    .status { min-height: 22px; margin-top: 8px; color: #a0495b; font-size: 14px; }
    .copy-button { width: 100%; min-height: 46px; margin-top: 8px; border: 1px solid #d9b8bf; border-radius: 12px; background: #fff8f9; color: #8c4e5a; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
    .copy-button:disabled { opacity: .55; cursor: not-allowed; }
    .copy-button.copied { border-color: #9ab99e; background: #f1f8f1; color: #3f7047; }
    @media (max-height: 650px) { .visual img { height: 34vh; min-height: 220px; } .text-box { padding: 14px 16px; } }
  </style>
</head>
<body>
  <main class="phone">
    <section class="screen" id="welcome">
      <header><h1 class="title">💐 꽃편지</h1><p class="subtitle">꽃을 고르고, 마음을 적어 연인에게 보내요.</p></header>
      <div class="card"><div class="visual"><img src="./IMG_5968.png" alt="분홍 장미 꽃다발" width="613" height="713"></div><div class="text-box"><h2>하루에 한 송이, 마음 한 다발</h2><p>연인과의 추억을 더 따뜻하게 남겨보세요. 꽃 한 송이와 짧은 편지로 마음을 전달할 수 있어요.</p><button class="cta" id="start" type="button">시작하기</button></div></div>
    </section>

    <section class="screen" id="pair" hidden>
      <button class="back" type="button" data-back="welcome">‹ 처음으로</button>
      <h1 class="title">커플 연결</h1><p class="subtitle">내 이름을 적고, 연결 코드를 만들거나 입력해요.</p>
      <div class="box">
        <label for="pair-name">내 이름</label>
        <input id="pair-name" maxlength="30" placeholder="이름을 적어주세요">
        <button class="cta" id="create-code" type="button">코드 만들기</button>
        <button class="copy-button" id="copy-code" type="button" disabled>코드 복사</button>
        <p class="status" id="create-status" aria-live="polite"></p>
      </div>
      <div class="box">
        <label for="pair-code">상대방의 6자리 코드</label>
        <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
        <button class="cta" id="join-code" type="button">코드로 연결하기</button>
        <p class="status" id="join-status" aria-live="polite"></p>
      </div>
    </section>

    <section class="screen" id="flowers" hidden>
      <button class="back" type="button" data-back="pair">‹ 커플 연결</button><h1 class="title">어떤 꽃을 보낼까요?</h1><p class="subtitle">마음을 담을 꽃 한 송이를 골라보세요.</p>
      <div class="choices" role="group" aria-label="꽃 선택">
        <button class="choice" type="button" aria-pressed="true" data-flower="장미"><span class="emoji">🌹</span><span><strong>장미</strong><small>사랑과 열정</small></span></button>
        <button class="choice" type="button" aria-pressed="false" data-flower="튤립"><span class="emoji">🌷</span><span><strong>튤립</strong><small>다정한 고백</small></span></button>
        <button class="choice" type="button" aria-pressed="false" data-flower="해바라기"><span class="emoji">🌻</span><span><strong>해바라기</strong><small>한결같은 마음</small></span></button>
        <button class="choice" type="button" aria-pressed="false" data-flower="데이지"><span class="emoji">🌼</span><span><strong>데이지</strong><small>맑고 순수한 마음</small></span></button>
      </div>
      <button class="cta" id="to-letter" type="button">편지 쓰기</button>
    </section>

    <section class="screen" id="letter" hidden>
      <button class="back" type="button" data-back="flowers">‹ 꽃 다시 고르기</button><h1 class="title">마음을 적어주세요</h1><p class="subtitle" id="chosen-flower">고른 꽃: 장미 🌹</p>
      <form id="letter-form"><label for="recipient">받는 사람</label><input id="recipient" name="recipient" autocomplete="name" placeholder="이름을 적어주세요" required><label for="message">메시지</label><textarea id="message" name="message" placeholder="연인에게 전하고 싶은 마음을 적어주세요" required></textarea><p class="hint">마음을 담아 보내는 한 송이, 더 오래 남아요.</p><button class="cta" type="submit">미리보기</button></form>
    </section>

    <section class="screen" id="preview" hidden>
      <button class="back" type="button" data-back="letter">‹ 편지 수정하기</button><h1 class="title">마음이 담긴 꽃편지 💌</h1><p class="subtitle" id="preview-flower"></p><div class="card text-box"><h2 id="preview-recipient"></h2><p id="preview-message" style="white-space: pre-wrap;"></p></div><button class="cta" type="button" data-back="welcome">처음으로</button>
    </section>
  </main>
  <script>
    const screens = document.querySelectorAll('.screen');
    let selectedFlower = '장미';
    let currentCode = '';
    let pollTimer;
    let copyResetTimer;
    function showScreen(id) { screens.forEach((screen) => { screen.hidden = screen.id !== id; }); window.scrollTo(0, 0); }
    function setStatus(id, message) { document.getElementById(id).textContent = message; }
    function resetCopyButton() {
      const button = document.getElementById('copy-code');
      button.textContent = '코드 복사';
      button.classList.remove('copied');
      clearTimeout(copyResetTimer);
    }
    async function api(path, body) {
      const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.message || '요청에 실패했어요.');
      return data;
    }
    function startPairPolling(code) {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const response = await fetch(`/api/pair/${encodeURIComponent(code)}`);
          const data = await response.json();
          if (response.status === 404) { clearInterval(pollTimer); setStatus('create-status', data.message); return; }
          if (data.paired) { clearInterval(pollTimer); setStatus('create-status', '연결됐어요! 꽃을 골라보세요.'); showScreen('flowers'); }
        } catch { setStatus('create-status', '연결 확인 중이에요. 인터넷 연결을 확인해주세요.'); }
      }, 2000);
    }
    document.getElementById('start').addEventListener('click', () => showScreen('pair'));
    document.querySelectorAll('[data-back]').forEach((button) => button.addEventListener('click', () => showScreen(button.dataset.back)));
    document.getElementById('create-code').addEventListener('click', async () => {
      const name = document.getElementById('pair-name').value.trim();
      if (!name) { setStatus('create-status', '이름을 적어주세요.'); document.getElementById('pair-name').focus(); return; }
      setStatus('create-status', '코드를 만들고 있어요…');
      document.getElementById('copy-code').disabled = true;
      resetCopyButton();
      try {
        const data = await api('/api/pair/create', { name });
        currentCode = data.code;
        document.getElementById('pair-code').value = data.code;
        document.getElementById('copy-code').disabled = false;
        setStatus('create-status', `상대방에게 이 코드를 공유하세요: ${data.code} (15분 동안 유효)`);
        startPairPolling(data.code);
      } catch (error) { setStatus('create-status', error.message); }
    });
    document.getElementById('copy-code').addEventListener('click', async () => {
      if (!currentCode) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(currentCode);
        } else {
          const codeInput = document.getElementById('pair-code');
          codeInput.focus();
          codeInput.select();
          if (!document.execCommand('copy')) throw new Error('copy failed');
        }
        const button = document.getElementById('copy-code');
        button.textContent = '복사 완료 ✓';
        button.classList.add('copied');
        setStatus('create-status', '코드를 복사했어요. 상대방에게 공유해주세요!');
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(resetCopyButton, 2500);
      } catch {
        setStatus('create-status', '복사할 수 없어요. 코드를 길게 눌러 복사해주세요.');
      }
    });
    document.getElementById('join-code').addEventListener('click', async () => {
      const name = document.getElementById('pair-name').value.trim();
      const code = document.getElementById('pair-code').value.trim();
      if (!name) { setStatus('join-status', '이름을 적어주세요.'); document.getElementById('pair-name').focus(); return; }
      if (!/^\d{6}$/.test(code)) { setStatus('join-status', '6자리 숫자 코드를 입력해주세요.'); document.getElementById('pair-code').focus(); return; }
      setStatus('join-status', '연결 중��에요…');
      try {
        const data = await api('/api/pair/join', { code, name });
        currentCode = data.code;
        clearInterval(pollTimer);
        setStatus('join-status', '연결됐어요! 꽃을 골라보세요.');
        showScreen('flowers');
      } catch (error) { setStatus('join-status', error.message); }
    });
    document.querySelectorAll('.choice').forEach((button) => button.addEventListener('click', () => {
      selectedFlower = button.dataset.flower;
      document.querySelectorAll('.choice').forEach((choice) => choice.setAttribute('aria-pressed', String(choice === button)));
      document.getElementById('chosen-flower').textContent = `고른 꽃: ${selectedFlower} ${button.querySelector('.emoji').textContent}`;
    }));
    document.getElementById('to-letter').addEventListener('click', () => showScreen('letter'));
    document.getElementById('letter-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      if (!form.reportValidity()) return;
      document.getElementById('preview-recipient').textContent = `${form.elements.recipient.value}에게`;
      document.getElementById('preview-message').textContent = form.elements.message.value;
      document.getElementById('preview-flower').textContent = `${selectedFlower} ${document.querySelector(`[data-flower="${selectedFlower}"] .emoji`).textContent} · 꽃말을 담아 보냅니다`;
      showScreen('preview');
    });
  </script>
</body>
</html>
