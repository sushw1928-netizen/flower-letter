<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f7">
  <title>꽃편지</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 16px max(24px, env(safe-area-inset-bottom));
      min-height: 100vh;
      min-height: 100svh;
      color: #382d31;
      background: #fff8f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100%, 560px); margin: 0 auto; }
    header { margin: 8px 0 22px; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 40px); line-height: 1.25; letter-spacing: -.06em; }
    .subtitle { margin: 8px 0 0; color: #927f83; font-size: clamp(17px, 4.5vw, 22px); line-height: 1.5; }
    .card { overflow: hidden; border: 1px solid #efd9dc; border-radius: 24px; background: #fff; }
    .bouquet { display: block; width: 100%; height: auto; object-fit: contain; background: #fff; }
    .copy { padding: 18px 22px 24px; text-align: center; }
    h2 { margin: 0 0 14px; font-size: clamp(25px, 6.5vw, 34px); line-height: 1.35; letter-spacing: -.06em; }
    .lead { margin: 0; font-size: clamp(19px, 5vw, 25px); line-height: 1.8; word-break: keep-all; }
    .description { margin: 20px 0 22px; color: #927f83; font-size: clamp(17px, 4.5vw, 22px); line-height: 1.8; word-break: keep-all; }
    button { width: 100%; min-height: 72px; border: 0; border-radius: 22px; background: #cf5f73; color: #fff; font: inherit; font-size: 27px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>💐 꽃편지</h1>
      <p class="subtitle">꽃을 고르고, 마음을 적어 연인에게 보내요.</p>
    </header>
    <section class="card" aria-label="꽃편지 소개">
      <img class="bouquet" src="./IMG_5968.png" alt="분홍 장미 꽃다발">
      <div class="copy">
        <h2>하루에 한 송이, 마음 한 다발</h2>
        <p class="lead">매일매일 꽃다발과 마음을 전할 수 있으면 좋겠다는 바람에서 시작됐습니다.</p>
        <p class="description">꽃을 고르고, 꽃말에 마음을 담아 편지를 쓰고, 사진도 함께 넣어 연인에게 보내 보세요. 특별한 날이 아니어도 괜찮아요. 오늘 하루를 꽃 한 다발로 건네봐요.</p>
        <button type="button">시작하기</button>
      </div>
    </section>
  </main>
</body>
</html>
