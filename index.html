<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efed">
  <title>꽃편지</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      background: #f4efed;
      color: #2e2a29;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .phone {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 20px 30px;
    }
    .title { margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -.06em; }
    .subtitle { margin: 7px 0 20px; color: #6f5d63; font-size: 17px; line-height: 1.5; }
    .card { overflow: hidden; border: 1px solid rgba(120,96,101,.16); border-radius: 24px; background: rgba(255,255,255,.32); box-shadow: 0 10px 24px rgba(96,72,78,.06); }
    .visual { display: grid; place-items: center; min-height: 320px; background: linear-gradient(#f2eeeb, #efe8e6); }
    .visual img { display: block; width: 100%; height: clamp(320px, 48vh, 480px); object-fit: contain; }
    .text-box { padding: 24px 20px 22px; }
    h2 { margin: 0 0 14px; font-size: 29px; line-height: 1.35; letter-spacing: -.06em; }
    .desc { margin: 0; color: #5f5557; font-size: 18px; line-height: 1.7; letter-spacing: -.02em; word-break: keep-all; }
    .desc + .desc { margin-top: 12px; }
    .cta { width: 100%; min-height: 60px; margin-top: 22px; border: 0; border-radius: 17px; background: linear-gradient(180deg, #d38a96, #cc7887); color: #fff; font: inherit; font-size: 24px; font-weight: 700; letter-spacing: -.04em; box-shadow: 0 10px 20px rgba(201,118,134,.2); }
    @media (min-width: 600px) {
      body { padding: 20px 0; }
      .phone { min-height: 0; border-radius: 24px; box-shadow: 0 10px 30px rgba(98,78,83,.08); }
    }
    @media (max-width: 360px) {
      .phone { padding-right: 16px; padding-left: 16px; }
      .visual img { height: 40vh; min-height: 260px; }
      h2 { font-size: 26px; }
      .desc { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <header>
      <h1 class="title">💐 꽃편지</h1>
      <p class="subtitle">꽃을 고르고, 마음을 적어 연인에게 보내요.</p>
    </header>
    <section class="card" aria-label="꽃편지 소개">
      <div class="visual">
        <img src="./IMG_5968.png" alt="분홍 장미 꽃다발" width="613" height="713" fetchpriority="high">
      </div>
      <div class="text-box">
        <h2>하루에 한 송이, 마음 한 다발</h2>
        <p class="desc">매일매일 꽃다발과 마음을 전할 수 있으면 좋겠다는 바람에서 시작했습니다.</p>
        <p class="desc">꽃을 고르고, 꽃말에 마음을 담아 편지를 쓰고, 사진도 함께 보내요. 특별한 날이 아니어도 괜찮아요. 오늘 하루를 꽃 한 다발로 건네봐요.</p>
        <button class="cta" type="button">시작하기</button>
      </div>
    </section>
  </main>
</body>
</html>
