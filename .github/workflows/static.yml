# 정적 콘텐츠를 GitHub 페이지에 배포하는 간단한 워크플로우
이름: 페이지에 정적 콘텐츠 배포

위에:
  # 기본 브랜치를 대상으로 푸시 실행
 푸시:
 나뭇가지: ["메인"]

  # 작업 탭에서 이 워크플로를 수동으로 실행할 수 있습니다
 워크플로우_dispatch:

# GitHub 페이지에 배포할 수 있도록 GITHUB_TOKEN의 권한을 설정합니다
권한:
 내용물: read
 페이지: 쓰기
 ID 토큰: 쓰기

# 진행 중인 실행과 최신 대기 중인 실행 사이에 대기 중인 실행을 건너뛰고 동시에 배포하는 것은 하나만 허용합니다.
# 그러나 이러한 프로덕션 배포를 완료할 수 있도록 진행 중인 실행을 취소하지 마십시오.
동시성:
 그룹.: "페이지"
 진행 취소: 거짓의

직업:
  # 단일 배포 작업, 우리가 막 배포하고 있기 때문에
 배포:
 환경:
 이름: 깃허브 페이지
 URL: ${step.deposition}.출력.page_url }
 런온: 우분투 latest
 단계:
 - 이름.: 체크아웃
 사용하다: 액션/checkout@v4
 - 이름.: 설정 페이지
 용도: 작업/구성-페이지@v5
 - 이름: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
